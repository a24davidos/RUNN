<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
            integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
            crossorigin=""
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="style.css" />
        <script
            src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""
        ></script>
        <script src="vendor/chart.umd.min.js"></script>

        <script src="script.js" defer></script>
        <title>Runn</title>
    </head>
    <body>
        <div id="container">
            <aside id="sidebar">
                <div class="sidebar-header">
                    <h2 class="app-title">RUNN</h2>
                </div>

                <div class="search-section">
                    <div class="search-box">
                        <span class="search-icon"></span>
                        <input
                            type="text"
                            id="search-place"
                            class="search-input"
                            placeholder="Buscar dirección o lugar..."
                        />
                        <button
                            type="button"
                            id="search-clear"
                            class="search-clear"
                            title="Borrar búsqueda"
                            tabindex="-1"
                        >
                            ✕
                        </button>
                        <ul id="search-results" class="search-results" hidden></ul>
                    </div>
                </div>

                <div class="section">
                    <h3 class="section-label">Estadísticas</h3>
                    <div class="stats-row">
                        <div class="stat-card">
                            <span class="stat-label">Distancia</span>
                            <span class="stat-value" id="counter-km">0 m</span>
                        </div>
                        <div class="stat-card">
                            <span class="stat-label">Desnivel</span>
                            <span class="stat-value" id="counter-elevation">—</span>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <h3 class="section-label">Perfil de elevación</h3>
                    <div class="elevation-card">
                        <canvas id="graphic"></canvas>
                    </div>
                    <button id="btn-elevation" class="btn-accent">
                        Calcular Elevación
                    </button>
                </div>

                <div class="points-section">
                    <div class="points-header">
                        <h3 class="section-label">
                            Puntos (<span id="counter">0</span>)
                        </h3>
                        <div class="points-header-actions">
                            <button
                                id="btn-undo-point"
                                class="icon-btn"
                                title="Deshacer último punto"
                            >
                                ↺
                            </button>
                            <button
                                id="btn-clear-route"
                                class="icon-btn icon-btn-danger"
                                title="Limpiar ruta"
                            >
                                ✕
                            </button>
                        </div>
                    </div>
                    <ol id="point-list"></ol>
                </div>
            </aside>
            <main id="map-wrapper">
                <div id="map"></div>
            </main>
        </div>
    </body>
</html>
